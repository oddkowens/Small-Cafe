# Rebuilds the Novels & Nibbles special on the pages whenever a special is
# added or edited (Pages CMS commits to main), and every morning so specials
# scheduled for a future day go live on that day.
name: Build specials

on:
  push:
    branches: [main]
    paths:
      - "specials/**"
      - "images/specials/**"
      - "_build/**"
  schedule:
    - cron: "0 10 * * *" # 6am Eastern (5am in winter)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-specials
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python _build/build_specials.py
      - name: Commit updated pages
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Novels & Nibbles special"
          git push
