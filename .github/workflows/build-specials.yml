# Rebuilds the Novels & Nibbles special on the pages whenever a special is
# added or edited (Pages CMS commits to the repo). Runs on every branch, so the
# "practice" branch gets its own preview without touching the live site.
name: Build specials

on:
  push:
    branches: ["**"]
    paths:
      - "specials/**"
      - "images/specials/**"
      - "_build/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-specials-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python _build/build_specials.py
      - name: Commit updated pages
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Novels & Nibbles special"
          git push
