# Pages CMS (https://app.pagescms.org) — the editor Ellen and Kyle use for the
# weekly Novels & Nibbles special. Saving commits to GitHub; the "Build
# specials" GitHub Action then updates the pages and Cloudflare deploys them.
# The "Make video" button on an entry runs the "Render special video" Action.
media:
  - name: photos
    label: Website photos
    input: images/specials
    output: /images/specials
    extensions: [jpg, jpeg, png, webp]
  # Video-only uploads (covers, stickers, audio) live under _video/, which the
  # website doesn't publish.
  - name: video
    label: Video uploads
    input: _video/uploads
    output: /_video/uploads
    extensions: [jpg, jpeg, png, webp, mp3, m4a, wav, aac]

content:
  - name: specials
    label: Novels & Nibbles specials
    description: >
      Add one entry per week. The special with the latest first day becomes the
      "Current Special" (Novels & Nibbles page, the menu page and the homepage
      photo) about two minutes after saving; older ones move to "Previous
      Special" automatically. Fill in the Video section and press "Make video"
      for the weekly clip.
    type: collection
    path: specials
    format: json
    filename: "{year}-{month}-{day}-{primary}.json"
    view:
      primary: title
      fields: [title, start, price]
      sort: [start, title]
      default:
        sort: start
        order: desc
    actions:
      - name: make-video
        label: Make video
        workflow: render-video.yml
        scope: entry
        confirm:
          title: Make the weekly video?
          message: Save your changes first. The video takes about 3 minutes; the download link then appears in the "Video" field (reload the entry).
          button: Make video
    fields:
      - name: title
        label: Book & author
        description: 'Shown as the heading, e.g. "Brady Bunch Book by Andy Edelstein & Frank Lovece"'
        type: string
        required: true
      - name: start
        label: First day
        description: Usually Wednesday. The latest first day is the current special.
        type: date
        required: true
      - name: end
        label: Last day
        description: Leave empty for the Sunday after the first day (filled in automatically when you save).
        type: date
      - name: hide_dates
        label: Hide the date line
        description: Tick to leave the dates off the website (the oldest specials never showed them).
        type: boolean
      - name: price
        label: Price
        description: e.g. $16.95
        type: string
      - name: photo
        label: Photo
        description: Used on the Novels & Nibbles page, as the homepage background, and in the video.
        type: image
        required: true
      - name: hero_focus
        label: Homepage photo focus
        description: Which part of the photo to keep in view on the wide homepage banner.
        type: select
        default: center
        options:
          values: [top, center, bottom]
      - name: description
        label: Description
        description: The story and the dish. Each paragraph shows as its own paragraph on the site.
        type: rich-text
        options:
          format: html

      # ── Video ──
      - name: cover
        label: "Video: book cover"
        description: >
          The book cover, shown first in the video. Use a large image (600+ pixels tall) so it's sharp.
          Leave empty to try Open Library's copy automatically.
        type: image
        options:
          media: video
      - name: video_summary
        label: "Video: book page text"
        description: The short blurb on the open book (about 2–4 sentences). Leave empty to use the start of the description.
        type: text
      - name: audio
        label: "Video: audio"
        description: The music or voiceover (mp3, m4a or wav). The video is as long as the audio, or the part set below (12–60 seconds); without audio it's 20 seconds and silent.
        type: file
        options:
          media: video
      - name: audio_start
        label: "Video: audio start"
        description: Where in the audio to begin, e.g. 0:10. Leave empty to start at the beginning.
        type: string
        pattern:
          regex: '^(\d{1,2}:\d{2}(\.\d+)?|\d+(\.\d+)?)?$'
          message: Use minutes:seconds like 0:10, or seconds like 10
      - name: audio_end
        label: "Video: audio end"
        description: Where to stop, e.g. 0:30. The video is as long as this section. Leave empty to play to the end (60 seconds at most).
        type: string
        pattern:
          regex: '^(\d{1,2}:\d{2}(\.\d+)?|\d+(\.\d+)?)?$'
          message: Use minutes:seconds like 0:30, or seconds like 30
      - name: decorations
        label: "Video: decoration emoji"
        description: >
          Leave empty and the video picks 3D pictures that match the dish (e.g. 🍎🥩🥔),
          then shows its picks here. To choose your own, type emoji here
          (Windows key + . on Windows, Ctrl + Cmd + Space on a Mac) and press Make video again.
        type: string
      - name: theme
        label: "Video: decoration style"
        description: Animated effects over the cover and dish. "auto" picks from the story (mystery → question marks, romance → hearts, sea → waves…).
        type: select
        default: auto
        options:
          values: [auto, sparkles, confetti, question-marks, hearts, sun, waves, stars, none]
      - name: sticker
        label: "Video: your own sticker (optional)"
        description: Your own picture (e.g. made in Canva) to use by the cover instead of the first emoji. A PNG with a transparent background works best.
        type: image
        options:
          media: video
      - name: video
        label: Video
        description: Download link for the finished video — filled in by "Make video".
        type: string
        readonly: true
      - name: video_notes
        label: Video notes
        description: Anything to fix from the last "Make video" (e.g. a book cover too small to look sharp).
        type: text
        readonly: true
