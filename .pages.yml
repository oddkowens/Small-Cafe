# Pages CMS (https://app.pagescms.org) — the editor Ellen and Kyle use for the
# weekly Novels & Nibbles special. Saving commits to GitHub; the "Build
# specials" GitHub Action then updates the pages and Cloudflare deploys them.
# The "Make video" button on an entry runs the "Render special video" Action.
media:
  - name: photos
    label: Website photos
    input: images/specials
    output: /images/specials
    extensions: [jpg, jpeg, png, webp]
  # Video-only uploads (covers, stickers, audio) live under _video/, which the
  # website doesn't publish.
  - name: video
    label: Video uploads
    input: _video/uploads
    output: /_video/uploads
    extensions: [jpg, jpeg, png, webp, mp3, m4a, wav, aac]

content:
  - name: specials
    label: Novels & Nibbles specials
    description: >
      Add one entry per week. The special with the latest first day becomes the
      "Current Special" (Novels & Nibbles page, the menu page and the homepage
      photo) about two minutes after saving; older ones move to "Previous
      Special" automatically. Saving the newest special also makes its weekly
      video (the download link appears about a minute later).
    type: collection
    path: specials
    format: json
    filename: "{year}-{month}-{day}-{primary}.json"
    view:
      primary: title
      fields: [title, start, price]
      sort: [start, title]
      default:
        sort: start
        order: desc
    actions:
      - name: reset-practice
        label: Reset practice
        workflow: reset-practice.yml
        ref: main
        scope: collection
        confirm:
          title: Reset the practice site?
          message: >
            The practice copy goes back to exactly what's on the live site: every
            special, photo and upload added on the practice branch is removed, and
            all videos made from practice are deleted. The live site isn't touched.
            Takes about a minute; then switch branches (or reload) to see it.
          button: Reset practice
      - name: publish
        label: Publish to live site
        workflow: publish-special.yml
        ref: main
        scope: entry
        confirm:
          title: Publish this special to the live site?
          message: >
            Copies just this special — with its photo, cover and audio — from
            practice to the live site, then makes the live video. Other practice
            specials aren't touched. Only works on the practice branch; save first.
            The live site updates in about two minutes.
          button: Publish
      - name: make-video
        label: Make video
        workflow: render-video.yml
        scope: entry
        confirm:
          title: Make the video again?
          message: >
            Saving the newest special already makes its video — use this for an
            older special, or to re-make one. Save your changes first. Takes about
            a minute; then reload the entry for the link.
          button: Make video
    fields:
      # ── Every week ──
      - name: title
        label: Book & author
        description: 'Shown as the heading, e.g. "Brady Bunch Book by Andy Edelstein & Frank Lovece"'
        type: string
        required: true
      - name: start
        label: First day
        description: Leave as today's date and it becomes this Wednesday (the café is closed Mon/Tue). The latest first day is the current special.
        type: date
        required: true
      - name: end
        label: Last day
        description: Leave as is for the Sunday after the first day (set automatically when you save). Change it only if the special runs differently.
        type: date
      - name: price
        label: Price
        description: e.g. $16.95
        type: string
      - name: photo
        label: Photo of the dish
        description: Used on the Novels & Nibbles page, as the homepage background, and in the video.
        type: image
        required: true
      - name: description
        label: Description
        description: The story and the dish. Each paragraph shows as its own paragraph on the site.
        type: rich-text
        options:
          format: html

      # ── Video (made automatically when you save the newest special) ──
      - name: cover
        label: "Video: book cover"
        description: >
          Leave empty and the video finds the cover itself (Google Books / Open Library).
          Upload one only if it can't, or picks the wrong edition — 600+ pixels tall so it's sharp.
        type: image
        options:
          media: video
      - name: audio
        label: "Video: audio"
        description: The music or voiceover (mp3, m4a or wav) if the café sent a file. Leave empty for a silent video and add the song in the Facebook/Instagram app when posting.
        type: file
        options:
          media: video
      - name: audio_start
        label: "Video: audio start"
        description: Where in the audio to begin, e.g. 0:10. Leave empty to start at the beginning.
        type: string
        pattern:
          regex: '^(\d{1,2}:\d{2}(\.\d+)?|\d+(\.\d+)?)?$'
          message: Use minutes:seconds like 0:10, or seconds like 10
      - name: audio_end
        label: "Video: audio end"
        description: Where to stop, e.g. 0:30. The video is as long as this section (12–60 seconds). Leave empty to play to the end.
        type: string
        pattern:
          regex: '^(\d{1,2}:\d{2}(\.\d+)?|\d+(\.\d+)?)?$'
          message: Use minutes:seconds like 0:30, or seconds like 30
      - name: video_summary
        label: "Video: book page text"
        description: The short blurb on the open book (2–4 sentences). Leave empty to use the start of the description.
        type: text
      - name: decorations
        label: "Video: decoration emoji"
        description: >
          Leave empty and the video picks 3D pictures that match the dish (e.g. 🍎🥩🥔),
          then shows its picks here. To choose your own, type emoji here
          (Windows key + . on Windows, Ctrl + Cmd + Space on a Mac) and save again.
        type: string
      - name: theme
        label: "Video: decoration style"
        description: Animated effects over the cover and dish. "auto" picks from the story (mystery → question marks, romance → hearts, sea → waves…).
        type: select
        default: auto
        options:
          values: [auto, sparkles, confetti, question-marks, hearts, sun, waves, stars, none]
      - name: video
        label: "Video: download link"
        description: The finished video — filled in about a minute after saving (reload the entry to see it).
        type: string
        readonly: true
      - name: video_notes
        label: "Video: notes"
        description: Anything to fix from the last video (e.g. a book cover too small to look sharp).
        type: text
        readonly: true

      # ── Rarely needed ──
      - name: sticker
        label: "Extra: your own sticker"
        description: Your own picture (e.g. made in Canva) to use by the cover instead of the first emoji. A PNG with a transparent background works best.
        type: image
        options:
          media: video
      - name: hero_focus
        label: "Extra: homepage photo focus"
        description: Which part of the dish photo to keep in view on the wide homepage banner.
        type: select
        default: center
        options:
          values: [top, center, bottom]
      - name: hide_dates
        label: "Extra: hide the date line"
        description: Tick to leave the dates off the website (the oldest specials never showed them).
        type: boolean
